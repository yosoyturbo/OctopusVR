<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061522"><link rel="manifest" href="manifest.webmanifest"><title>OctopusVR</title>
<style>
:root{--cyan:#00eaff;--purple:#b65cff;--glass:rgba(9,30,48,.72);--line:rgba(0,234,255,.25);font-family:Inter,system-ui,Arial;color:#e8fbff}
*{box-sizing:border-box}body{margin:0;background:#04121d;overflow:hidden}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:rgba(0,234,255,.08);border-radius:12px;padding:9px 13px}button:hover{background:rgba(0,234,255,.18);box-shadow:0 0 18px #00eaff22}#ocean{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 10%,#10405b 0,#061b2b 35%,#020a13 100%);z-index:-2}#ocean:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#00eaff08,#b65cff08);animation:water 8s ease-in-out infinite alternate}@keyframes water{to{filter:hue-rotate(35deg)}}.bubble{position:absolute;border:1px solid #00eaff44;border-radius:50%;animation:rise 12s linear infinite;bottom:-40px}@keyframes rise{to{transform:translateY(-110vh);opacity:0}}#top{height:60px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#061522aa;backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:1px;color:var(--cyan)}#clock{margin-left:auto;color:#b6d9e8}#home{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;overflow:auto;height:calc(100vh - 115px)}.tile{min-height:105px;background:linear-gradient(140deg,#09263acc,#10152dcc);border:1px solid var(--line);border-radius:20px;padding:15px;backdrop-filter:blur(18px);box-shadow:0 8px 25px #0003;display:flex;flex-direction:column;gap:8px}.tile .emoji{font-size:28px}.tile small{color:#9bc5d8}.dock{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:8px;background:#061522bb;backdrop-filter:blur(25px);border:1px solid var(--line);border-radius:18px;max-width:90vw;overflow:auto}.dock button{white-space:nowrap}.window{position:absolute;left:8%;top:12%;width:min(900px,84vw);height:min(650px,75vh);background:rgba(4,18,31,.88);backdrop-filter:blur(26px);border:1px solid #00eaff66;border-radius:20px;box-shadow:0 20px 70px #0008;overflow:hidden;display:flex;flex-direction:column}.winhead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0a2638;border-bottom:1px solid var(--line);cursor:move;touch-action:none}.winhead strong{flex:1}.winbody{padding:14px;overflow:auto;flex:1}.winbody canvas.scene{width:100%;height:100%;min-height:350px;display:block}.close{color:#ff829e}.cam{width:100%;max-height:300px;object-fit:contain;background:#000;border-radius:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.panel{padding:12px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:#06233788}.hidden{display:none!important}input,select{background:#071b2a;border:1px solid var(--line);border-radius:10px;padding:9px}#boot{position:fixed;inset:0;background:#04121d;display:grid;place-items:center;z-index:20}.bootcard{width:min(420px,90vw);padding:25px;text-align:center;border:1px solid var(--line);border-radius:24px;background:#082235cc;box-shadow:0 0 60px #00eaff18}.bootlogo{font-size:60px;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}.status{color:#8fc5d8;font-size:13px}.danger{border-color:#ff7899;color:#ff9db5}@media(max-width:600px){#home{grid-template-columns:repeat(2,1fr);padding:10px}.window{left:3%;top:8%;width:94vw;height:82vh}.brand{font-size:14px}}
</style></head><body><div id="ocean"></div>
<div id="boot"><div class="bootcard"><div class="bootlogo">🐙</div><h1>OctopusVR</h1><p>Seu espaço virtual oceânico</p><input id="username" placeholder="Nome do perfil" maxlength="24"><p><button id="enter">Entrar no OctopusVR</button></p><div class="status">Perfil local • modo offline</div></div></div>
<header id="top"><span class="brand">🐙 OCTOPUSVR</span><span id="profileTag">Perfil</span><span id="clock"></span><button id="quickCam">📷 Câmera</button></header>
<main id="home"></main><nav class="dock" id="dock"><button onclick="openApp('Home')">🏠 Home</button><button onclick="openApp('Desktop')">🪟 Desktop</button><button onclick="openApp('Hand Studio')">🖐 Hand</button><button onclick="openApp('PaintVR')">🎨 Paint</button></nav>
<script type="module" src="./main.js"></script></body></html>
